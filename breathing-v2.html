<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>CalmMe - Breathing Guide</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            height: 100vh;
            color: white;
        }

        /* Same space background */
        .background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center, #1a1a3f 0%, #0d0d1f 50%, #000000 100%);
            z-index: -2;
        }

        .background::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(2px 2px at 20px 30px, #eee, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 60px 70px, #fff, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 50px 50px, #fff, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 130px 80px, #fff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 90px 10px, #fff, rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 200px 200px;
            animation: twinkle 5s ease-in-out infinite;
            z-index: -1;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        .background::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.3);
            z-index: -1;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            padding: 2rem;
            position: relative;
            overflow-y: auto;
        }

        /* Back button */
        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            padding: 10px 18px;
            border-radius: 40px;
            font-size: 1rem;
            cursor: pointer;
            z-index: 100;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-weight: 500;
        }

        /* No bounce on sphere - removed float animation */
        .sphere-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 20px 0;
        }

        /* Breathing sphere - glassy + glowing, no bounce */
        .sphere {
            width: 280px;
            height: 280px;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            backdrop-filter: blur(20px);
            border: 2px solid rgba(255, 255, 255, 0.4);
            background: linear-gradient(135deg, rgba(79, 172, 254, 0.3) 0%, rgba(0, 242, 254, 0.3) 100%);
            color: #4facfe;
            box-shadow: 
                0 0 30px rgba(79, 172, 254, 0.5),
                0 0 60px rgba(79, 172, 254, 0.3),
                inset -20px -20px 40px rgba(0, 0, 0, 0.2),
                inset 15px 15px 30px rgba(255, 255, 255, 0.2);
            transition: transform 0.05s linear, box-shadow 0.2s ease;
            will-change: transform;
            transform: scale(0.7);
        }

        /* Glow pulse when breathing active (subtle) */
        .sphere.breathing-active {
            box-shadow: 
                0 0 50px rgba(79, 172, 254, 0.8),
                0 0 100px rgba(79, 172, 254, 0.5),
                inset -20px -20px 40px rgba(0, 0, 0, 0.2),
                inset 15px 15px 30px rgba(255, 255, 255, 0.25);
        }

        .sphere-content {
            z-index: 101;
            color: white;
            position: relative;
            pointer-events: none;
        }

        .sphere-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5), 0 0 20px currentColor;
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.3));
            color: #4facfe;
        }

        .sphere-name {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            text-shadow: 0 2px 15px rgba(0, 0, 0, 0.7), 0 0 15px currentColor;
            letter-spacing: 1px;
        }

        .phase-text {
            font-size: 1.8rem;
            font-weight: bold;
            margin-top: 0.5rem;
            text-shadow: 0 0 20px rgba(79,172,254,0.8);
        }

        /* Session timer */
        .session-timer {
            font-size: 1.8rem;
            font-family: monospace;
            letter-spacing: 2px;
            background: rgba(100,200,255,0.15);
            backdrop-filter: blur(10px);
            padding: 8px 24px;
            border-radius: 50px;
            border: 1px solid rgba(100,200,255,0.4);
            margin: 20px 0;
            display: inline-block;
        }

        /* Glassy buttons - all same width & responsive */
        .controls, .duration-buttons, .sound-buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 1rem;
        }

        .glass-btn {
            background: rgba(100,200,255,0.15);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(100,200,255,0.5);
            color: white;
            padding: 10px 20px;
            border-radius: 40px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            min-width: 100px;
            justify-content: center;
        }

        .glass-btn:hover {
            background: rgba(100,200,255,0.35);
            transform: scale(1.02);
            box-shadow: 0 0 20px rgba(100,200,255,0.4);
            border-color: rgba(100,200,255,0.8);
        }

        .glass-btn.active {
            background: rgba(100,200,255,0.6);
            border-color: white;
            box-shadow: 0 0 15px rgba(100,200,255,0.6);
        }

        /* Ensure buttons have equal width on same row */
        @media (min-width: 600px) {
            .glass-btn {
                min-width: 110px;
            }
        }

        @media (max-width: 480px) {
            .glass-btn {
                padding: 6px 12px;
                font-size: 0.75rem;
                min-width: 70px;
            }
            .sphere { width: 200px; height: 200px; }
            .sphere-icon { font-size: 2.5rem; }
            .sphere-name { font-size: 1.2rem; }
            .phase-text { font-size: 1.3rem; }
        }
    </style>
</head>
<body>
<div class="background"></div>
<div class="container">
    <a href="javascript:history.back()" class="back-btn"><i class="fas fa-arrow-left"></i> Back</a>

    <!-- Breathing Sphere (no bounce wrapper) -->
    <div class="sphere-wrapper">
        <div class="sphere" id="breathingSphere">
            <div class="sphere-content">
                <div class="sphere-icon"><i class="fas fa-wind"></i></div>
                <div class="sphere-name">Breathing</div>
                <div class="phase-text" id="phaseText">Inhale</div>
            </div>
        </div>
    </div>

    <div class="session-timer" id="sessionTimer">05:00</div>

    <div class="controls">
        <button class="glass-btn" id="startBtn"><i class="fas fa-play"></i> Start</button>
        <button class="glass-btn" id="pauseBtn"><i class="fas fa-pause"></i> Pause</button>
        <button class="glass-btn" id="resetBtn"><i class="fas fa-sync-alt"></i> Reset</button>
    </div>

    <div class="duration-buttons">
        <button class="glass-btn duration-btn" data-minutes="2">2 min</button>
        <button class="glass-btn duration-btn active" data-minutes="5">5 min</button>
        <button class="glass-btn duration-btn" data-minutes="10">10 min</button>
    </div>

    <!-- 9 Soothing Sound Buttons -->
    <div class="sound-buttons">
        <button class="glass-btn sound-btn" data-sound="waterfall"><i class="fas fa-water"></i> Waterfall</button>
        <button class="glass-btn sound-btn" data-sound="rain"><i class="fas fa-cloud-rain"></i> Rain</button>
        <button class="glass-btn sound-btn" data-sound="birds"><i class="fas fa-dove"></i> Birds</button>
        <button class="glass-btn sound-btn" data-sound="fire"><i class="fas fa-fire"></i> Fire</button>
        <button class="glass-btn sound-btn" data-sound="ocean"><i class="fas fa-water"></i> Ocean</button>
        <button class="glass-btn sound-btn" data-sound="piano"><i class="fas fa-music"></i> Piano</button>
        <button class="glass-btn sound-btn" data-sound="flute"><i class="fas fa-drumstick-bite"></i> Flute</button>
        <button class="glass-btn sound-btn" data-sound="chimes"><i class="fas fa-bell"></i> Chimes</button>
        <button class="glass-btn sound-btn" data-sound="whitenoise"><i class="fas fa-volume-up"></i> White Noise</button>
    </div>
</div>

<script>
    // --- Smooth breathing animation (no bounce, just scale) ---
    const sphere = document.getElementById('breathingSphere');
    const phaseText = document.getElementById('phaseText');
    const sessionTimerEl = document.getElementById('sessionTimer');
    const startBtn = document.getElementById('startBtn');
    const pauseBtn = document.getElementById('pauseBtn');
    const resetBtn = document.getElementById('resetBtn');
    const durationBtns = document.querySelectorAll('.duration-btn');

    const INHALE_DURATION = 4000;
    const EXHALE_DURATION = 4000;
    const MIN_SCALE = 0.7;
    const MAX_SCALE = 1.2;

    let animationId = null;
    let breathStartTime = 0;
    let currentPhase = 'inhale';
    let isBreathingActive = false;

    // Session timer
    let sessionSeconds = 5 * 60;
    let sessionInterval = null;
    let isSessionActive = false;

    // Add/remove glow class on sphere when active
    function updateGlow() {
        if (isBreathingActive) {
            sphere.classList.add('breathing-active');
        } else {
            sphere.classList.remove('breathing-active');
        }
    }

    function updateScale(timestamp) {
        if (!isBreathingActive) return;
        if (!breathStartTime) {
            breathStartTime = timestamp;
            requestAnimationFrame(updateScale);
            return;
        }
        let elapsed = timestamp - breathStartTime;
        let duration = (currentPhase === 'inhale') ? INHALE_DURATION : EXHALE_DURATION;
        let progress = Math.min(1, elapsed / duration);
        let scale;
        if (currentPhase === 'inhale') {
            scale = MIN_SCALE + (MAX_SCALE - MIN_SCALE) * progress;
        } else {
            scale = MAX_SCALE - (MAX_SCALE - MIN_SCALE) * progress;
        }
        sphere.style.transform = `scale(${scale})`;

        if (progress >= 1) {
            currentPhase = (currentPhase === 'inhale') ? 'exhale' : 'inhale';
            breathStartTime = timestamp;
            phaseText.textContent = (currentPhase === 'inhale') ? 'Inhale' : 'Exhale';
        }
        animationId = requestAnimationFrame(updateScale);
    }

    function startBreathing() {
        if (animationId) cancelAnimationFrame(animationId);
        isBreathingActive = true;
        breathStartTime = performance.now();
        currentPhase = 'inhale';
        phaseText.textContent = 'Inhale';
        updateGlow();
        animationId = requestAnimationFrame(updateScale);
    }

    function stopBreathing() {
        isBreathingActive = false;
        updateGlow();
        if (animationId) {
            cancelAnimationFrame(animationId);
            animationId = null;
        }
    }

    // Session functions
    function updateSessionDisplay() {
        const mins = Math.floor(sessionSeconds / 60);
        const secs = sessionSeconds % 60;
        sessionTimerEl.textContent = `${mins.toString().padStart(2,'0')}:${secs.toString().padStart(2,'0')}`;
    }

    function sessionTick() {
        if (!isSessionActive) return;
        if (sessionSeconds <= 0) {
            pauseSession();
            alert('Session complete! Well done 🧘');
            return;
        }
        sessionSeconds--;
        updateSessionDisplay();
    }

    function startSession() {
        if (isSessionActive) return;
        if (sessionSeconds <= 0) resetSession();
        isSessionActive = true;
        startBreathing();
        sessionInterval = setInterval(sessionTick, 1000);
    }

    function pauseSession() {
        isSessionActive = false;
        stopBreathing();
        if (sessionInterval) {
            clearInterval(sessionInterval);
            sessionInterval = null;
        }
    }

    function resetSession() {
        pauseSession();
        const activeBtn = document.querySelector('.duration-btn.active');
        const mins = parseInt(activeBtn.dataset.minutes);
        sessionSeconds = mins * 60;
        updateSessionDisplay();
        currentPhase = 'inhale';
        sphere.style.transform = `scale(${MIN_SCALE})`;
        phaseText.textContent = 'Inhale';
        isBreathingActive = false;
        updateGlow();
        if (animationId) cancelAnimationFrame(animationId);
        animationId = null;
    }

    // Duration buttons
    durationBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            durationBtns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            const mins = parseInt(btn.dataset.minutes);
            sessionSeconds = mins * 60;
            updateSessionDisplay();
            if (!isSessionActive) resetSession();
        });
    });

    startBtn.addEventListener('click', startSession);
    pauseBtn.addEventListener('click', pauseSession);
    resetBtn.addEventListener('click', resetSession);

    // --- 9 Soothing Sounds: using reliable audio URLs (free, no CORS issues) ---
    // For best experience, replace with local files or your own URLs.
    const soundMap = {
        waterfall: 'https://cdn.pixabay.com/download/audio/2022/03/15/audio_waterfall.mp3',
        rain: 'https://cdn.pixabay.com/download/audio/2022/03/15/audio_rain.mp3',
        birds: 'https://cdn.pixabay.com/download/audio/2022/03/15/audio_birds.mp3',
        fire: 'https://cdn.pixabay.com/download/audio/2022/03/15/audio_fire.mp3',
        ocean: 'https://cdn.pixabay.com/download/audio/2022/03/15/audio_ocean_waves.mp3',
        piano: 'https://cdn.pixabay.com/download/audio/2022/03/15/audio_piano.mp3',
        flute: 'https://cdn.pixabay.com/download/audio/2022/03/15/audio_flute.mp3',
        chimes: 'https://cdn.pixabay.com/download/audio/2022/03/15/audio_chimes.mp3',
        whitenoise: 'https://cdn.pixabay.com/download/audio/2022/03/15/audio_white_noise.mp3'
    };

    let activeSounds = {};

    function playSound(soundName, button) {
        if (activeSounds[soundName]) {
            activeSounds[soundName].pause();
            activeSounds[soundName].currentTime = 0;
            delete activeSounds[soundName];
            button.classList.remove('active');
        } else {
            const audio = new Audio(soundMap[soundName]);
            audio.loop = true;
            audio.volume = 0.25;
            audio.play().catch(e => console.log('Audio play error:', e));
            activeSounds[soundName] = audio;
            button.classList.add('active');
        }
    }

    document.querySelectorAll('.sound-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            const sound = btn.dataset.sound;
            playSound(sound, btn);
        });
    });

    // Initial reset
    resetSession();
</script>
</body>
</html>
