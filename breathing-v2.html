<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>CalmMe - 4-7-8 Breathing</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            color: white;
            background: radial-gradient(ellipse at center, #1a1a3f 0%, #0d0d1f 50%, #000000 100%);
            overflow-x: hidden;
            overflow-y: auto;
        }

        /* Star animation */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }
        .stars::before, .stars::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(2px 2px at 20px 30px, #fff, rgba(0,0,0,0)),
                              radial-gradient(2px 2px at 60px 70px, #eee, rgba(0,0,0,0)),
                              radial-gradient(1px 1px at 90px 10px, #fff, rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 200px 200px;
            animation: twinkle 5s infinite;
        }
        @keyframes twinkle { 0%,100%{ opacity:0.3; } 50%{ opacity:1; } }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 80px 20px 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
        }

        /* Back button */
        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            padding: 8px 16px;
            border-radius: 40px;
            font-size: 0.9rem;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            z-index: 100;
            transition: 0.2s;
        }
        .back-btn:hover { background: rgba(255,255,255,0.3); }

        /* Breathing Sphere - glassmorphism + glow */
        .sphere {
            width: 260px;
            height: 260px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(79,172,254,0.3), rgba(0,242,254,0.2));
            backdrop-filter: blur(12px);
            border: 2px solid rgba(255,255,255,0.4);
            box-shadow: 0 0 40px rgba(79,172,254,0.5), inset 0 0 30px rgba(255,255,255,0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            transition: transform 0.05s linear;
            transform: scale(1);
            will-change: transform;
        }
        .sphere.active-glow {
            box-shadow: 0 0 60px rgba(79,172,254,0.8), 0 0 100px rgba(79,172,254,0.4), inset 0 0 30px rgba(255,255,255,0.3);
        }
        .sphere-icon { font-size: 3.5rem; margin-bottom: 0.5rem; color: #7ec8ff; }
        .sphere-name { font-size: 1.6rem; font-weight: bold; margin-bottom: 0.5rem; }
        .phase-text { font-size: 1.8rem; font-weight: bold; text-transform: uppercase; letter-spacing: 2px; text-shadow: 0 0 15px cyan; }

        /* Circular Progress Timer */
        .timer-container {
            position: relative;
            width: 120px;
            height: 120px;
            margin: 1rem 0;
        }
        .circular-progress {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .circular-progress svg {
            position: absolute;
            top: 0;
            left: 0;
            transform: rotate(-90deg);
        }
        .circular-progress circle {
            fill: none;
            stroke: #4facfe;
            stroke-width: 4;
            stroke-dasharray: 351; /* 2*pi*56 ≈ 351.8 */
            stroke-dashoffset: 351;
            transition: stroke-dashoffset 0.1s linear;
        }
        .timer-text {
            font-size: 1.8rem;
            font-family: monospace;
            font-weight: bold;
            color: white;
            text-shadow: 0 0 10px cyan;
        }

        /* Professional Controls Grid */
        .controls-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            width: 100%;
            max-width: 350px;
            margin: 0.5rem 0;
        }
        .duration-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.8rem;
            width: 100%;
            max-width: 300px;
        }
        .sound-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 0.8rem;
            width: 100%;
            margin-top: 0.5rem;
        }

        /* Button Styles */
        .btn {
            padding: 12px 0;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s ease;
            border: none;
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-primary {
            background: rgba(79,172,254,0.2);
            border: 1px solid rgba(79,172,254,0.6);
            color: #b8e1ff;
        }
        .btn-primary:hover { background: rgba(79,172,254,0.4); transform: scale(1.02); }
        .btn-primary:active { transform: scale(0.98); }
        .btn-primary.active {
            background: rgba(79,172,254,0.7);
            border-color: white;
            color: white;
            box-shadow: 0 0 15px cyan;
        }

        /* Sound buttons - distinct purple theme */
        .btn-sound {
            background: rgba(180, 130, 255, 0.2);
            border: 1px solid rgba(180, 130, 255, 0.6);
            color: #d9b8ff;
        }
        .btn-sound:hover { background: rgba(180, 130, 255, 0.4); transform: scale(1.02); }
        .btn-sound.active {
            background: rgba(180, 130, 255, 0.7);
            border-color: white;
            color: white;
            box-shadow: 0 0 15px #b482ff;
        }

        .duration-btn {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            padding: 8px 0;
        }
        .duration-btn.active {
            background: rgba(79,172,254,0.6);
            border-color: white;
        }

        @media (max-width: 550px) {
            .sphere { width: 200px; height: 200px; }
            .sphere-icon { font-size: 2.5rem; }
            .sphere-name { font-size: 1.2rem; }
            .phase-text { font-size: 1.3rem; }
            .timer-container { width: 100px; height: 100px; }
            .timer-text { font-size: 1.4rem; }
            .btn { font-size: 0.8rem; padding: 8px 0; }
        }
    </style>
</head>
<body>
<div class="stars"></div>
<div class="container">
    <a href="javascript:history.back()" class="back-btn"><i class="fas fa-arrow-left"></i> Back</a>

    <!-- Breathing Sphere -->
    <div class="sphere" id="breathingSphere">
        <div class="sphere-icon"><i class="fas fa-wind"></i></div>
        <div class="sphere-name">4-7-8 Breathing</div>
        <div class="phase-text" id="phaseText">Inhale</div>
    </div>

    <!-- Circular Timer -->
    <div class="timer-container">
        <div class="circular-progress">
            <svg width="120" height="120" viewBox="0 0 120 120">
                <circle cx="60" cy="60" r="56" stroke="rgba(255,255,255,0.2)" stroke-width="4" fill="none"></circle>
                <circle id="progressCircle" cx="60" cy="60" r="56" fill="none" stroke="#4facfe" stroke-width="4" stroke-linecap="round"></circle>
            </svg>
            <span class="timer-text" id="timerText">00:00</span>
        </div>
    </div>

    <!-- Control Buttons -->
    <div class="controls-grid">
        <button class="btn btn-primary" id="startBtn"><i class="fas fa-play"></i> Start</button>
        <button class="btn btn-primary" id="pauseBtn"><i class="fas fa-pause"></i> Pause</button>
        <button class="btn btn-primary" id="resetBtn"><i class="fas fa-sync-alt"></i> Reset</button>
    </div>

    <!-- Duration Selection -->
    <div class="duration-grid">
        <button class="btn duration-btn" data-minutes="2">2 min</button>
        <button class="btn duration-btn active" data-minutes="5">5 min</button>
        <button class="btn duration-btn" data-minutes="10">10 min</button>
    </div>

    <!-- 9 Soothing Sounds (Purple theme) -->
    <div class="sound-grid">
        <button class="btn btn-sound sound-btn" data-sound="waterfall"><i class="fas fa-water"></i> Waterfall</button>
        <button class="btn btn-sound sound-btn" data-sound="rain"><i class="fas fa-cloud-rain"></i> Rain</button>
        <button class="btn btn-sound sound-btn" data-sound="birds"><i class="fas fa-dove"></i> Birds</button>
        <button class="btn btn-sound sound-btn" data-sound="fire"><i class="fas fa-fire"></i> Fire</button>
        <button class="btn btn-sound sound-btn" data-sound="ocean"><i class="fas fa-water"></i> Ocean</button>
        <button class="btn btn-sound sound-btn" data-sound="piano"><i class="fas fa-music"></i> Piano</button>
        <button class="btn btn-sound sound-btn" data-sound="flute"><i class="fas fa-drumstick-bite"></i> Flute</button>
        <button class="btn btn-sound sound-btn" data-sound="chimes"><i class="fas fa-bell"></i> Chimes</button>
        <button class="btn btn-sound sound-btn" data-sound="whitenoise"><i class="fas fa-volume-up"></i> White Noise</button>
    </div>
</div>

<script>
    // 4-7-8 Breathing pattern (in seconds)
    const INHALE = 4;
    const HOLD = 7;
    const EXHALE = 8;
    // Total cycle time = 4+7+8 = 19 seconds

    let currentPhase = 'inhale'; // inhale, hold, exhale
    let phaseRemaining = INHALE;
    let isActive = false;
    let animationFrame = null;
    let lastTimestamp = 0;
    let phaseStartTime = 0;

    let sessionSeconds = 5 * 60; // 5 min default
    let sessionInterval = null;
    let isSessionActive = false;

    // DOM elements
    const sphere = document.getElementById('breathingSphere');
    const phaseText = document.getElementById('phaseText');
    const timerText = document.getElementById('timerText');
    const progressCircle = document.getElementById('progressCircle');
    const startBtn = document.getElementById('startBtn');
    const pauseBtn = document.getElementById('pauseBtn');
    const resetBtn = document.getElementById('resetBtn');
    const durationBtns = document.querySelectorAll('.duration-btn');

    // Circle circumference: 2 * pi * 56 = 351.858
    const circumference = 2 * Math.PI * 56;
    progressCircle.style.strokeDasharray = circumference;

    function updateProgress(phase, remaining) {
        let totalPhaseTime = (phase === 'inhale') ? INHALE : (phase === 'hold') ? HOLD : EXHALE;
        let fraction = (totalPhaseTime - remaining) / totalPhaseTime;
        let dashOffset = circumference * (1 - fraction);
        progressCircle.style.strokeDashoffset = dashOffset;
    }

    function setPhase(newPhase) {
        currentPhase = newPhase;
        if (currentPhase === 'inhale') phaseRemaining = INHALE;
        else if (currentPhase === 'hold') phaseRemaining = HOLD;
        else phaseRemaining = EXHALE;
        phaseText.textContent = currentPhase === 'inhale' ? 'Inhale' : (currentPhase === 'hold' ? 'Hold' : 'Exhale');
        // Reset progress
        updateProgress(currentPhase, phaseRemaining);
    }

    function nextPhase() {
        if (currentPhase === 'inhale') setPhase('hold');
        else if (currentPhase === 'hold') setPhase('exhale');
        else setPhase('inhale');
    }

    function breathingTick(now) {
        if (!isActive) return;
        if (!phaseStartTime) {
            phaseStartTime = now;
            requestAnimationFrame(breathingTick);
            return;
        }
        let elapsed = (now - phaseStartTime) / 1000;
        if (elapsed >= phaseRemaining) {
            // Move to next phase
            nextPhase();
            phaseStartTime = now;
            elapsed = 0;
        }
        // Update remaining time for display
        let remaining = Math.max(0, phaseRemaining - elapsed);
        updateProgress(currentPhase, remaining);
        // Update sphere scale based on phase and progress (smooth)
        let scale;
        let progress = elapsed / phaseRemaining;
        if (currentPhase === 'inhale') {
            scale = 0.7 + (progress * 0.5); // 0.7 -> 1.2
        } else if (currentPhase === 'hold') {
            scale = 1.2; // stay expanded
        } else {
            scale = 1.2 - (progress * 0.5); // 1.2 -> 0.7
        }
        sphere.style.transform = `scale(${scale})`;
        // Add glow effect
        if (isActive) sphere.classList.add('active-glow');
        else sphere.classList.remove('active-glow');
        animationFrame = requestAnimationFrame(breathingTick);
    }

    function startBreathing() {
        if (animationFrame) cancelAnimationFrame(animationFrame);
        isActive = true;
        phaseStartTime = performance.now();
        setPhase('inhale');
        animationFrame = requestAnimationFrame(breathingTick);
    }

    function stopBreathing() {
        isActive = false;
        if (animationFrame) {
            cancelAnimationFrame(animationFrame);
            animationFrame = null;
        }
        sphere.classList.remove('active-glow');
        // Reset sphere scale to min
        sphere.style.transform = 'scale(0.7)';
    }

    // Session timer with mm:ss display
    function updateSessionTimerDisplay() {
        const mins = Math.floor(sessionSeconds / 60);
        const secs = sessionSeconds % 60;
        timerText.textContent = `${mins.toString().padStart(2,'0')}:${secs.toString().padStart(2,'0')}`;
    }

    function sessionTick() {
        if (!isSessionActive) return;
        if (sessionSeconds <= 0) {
            // Session complete
            pauseSession();
            alert('🧘 Session complete! Well done.');
            return;
        }
        sessionSeconds--;
        updateSessionTimerDisplay();
    }

    function startSession() {
        if (isSessionActive) return;
        if (sessionSeconds <= 0) resetSession();
        isSessionActive = true;
        startBreathing();
        sessionInterval = setInterval(sessionTick, 1000);
    }

    function pauseSession() {
        isSessionActive = false;
        stopBreathing();
        if (sessionInterval) {
            clearInterval(sessionInterval);
            sessionInterval = null;
        }
    }

    function resetSession() {
        pauseSession();
        const activeDuration = document.querySelector('.duration-btn.active');
        const mins = parseInt(activeDuration.dataset.minutes);
        sessionSeconds = mins * 60;
        updateSessionTimerDisplay();
        // Reset breathing
        stopBreathing();
        setPhase('inhale');
        sphere.style.transform = 'scale(0.7)';
        updateProgress('inhale', INHALE);
    }

    // Duration buttons
    durationBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            durationBtns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            const mins = parseInt(btn.dataset.minutes);
            sessionSeconds = mins * 60;
            updateSessionTimerDisplay();
            if (!isSessionActive) resetSession();
        });
    });

    startBtn.addEventListener('click', startSession);
    pauseBtn.addEventListener('click', pauseSession);
    resetBtn.addEventListener('click', resetSession);

    // --- Sound effects with distinct purple buttons (9 sounds) ---
    // Reliable free sound URLs (Pixabay CDN). Replace if needed.
    const soundMap = {
        waterfall: 'https://cdn.pixabay.com/download/audio/2022/03/15/audio_waterfall.mp3',
        rain: 'https://cdn.pixabay.com/download/audio/2022/03/15/audio_rain.mp3',
        birds: 'https://cdn.pixabay.com/download/audio/2022/03/15/audio_birds.mp3',
        fire: 'https://cdn.pixabay.com/download/audio/2022/03/15/audio_fire.mp3',
        ocean: 'https://cdn.pixabay.com/download/audio/2022/03/15/audio_ocean_waves.mp3',
        piano: 'https://cdn.pixabay.com/download/audio/2022/03/15/audio_piano.mp3',
        flute: 'https://cdn.pixabay.com/download/audio/2022/03/15/audio_flute.mp3',
        chimes: 'https://cdn.pixabay.com/download/audio/2022/03/15/audio_chimes.mp3',
        whitenoise: 'https://cdn.pixabay.com/download/audio/2022/03/15/audio_white_noise.mp3'
    };

    let activeSounds = {};

    function toggleSound(soundName, button) {
        if (activeSounds[soundName]) {
            activeSounds[soundName].pause();
            activeSounds[soundName].currentTime = 0;
            delete activeSounds[soundName];
            button.classList.remove('active');
        } else {
            const audio = new Audio(soundMap[soundName]);
            audio.loop = true;
            audio.volume = 0.25;
            audio.play().catch(e => console.log('Audio error:', e));
            activeSounds[soundName] = audio;
            button.classList.add('active');
        }
    }

    document.querySelectorAll('.sound-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            const sound = btn.dataset.sound;
            toggleSound(sound, btn);
        });
    });

    // Initialize
    resetSession();
</script>
</body>
</html>
