<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CalmMe - Mindfulness Portals</title>
    <link rel="stylesheet" href="mindfulness-styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Space Background with Stars -->
    <div class="background"></div>

    <!-- Back Button (Floating) -->
    <a href="index-v2.html" class="back-btn">
        <i class="fas fa-arrow-left"></i>
    </a>

    <!-- Main Container -->
    <div class="container">
        <!-- Portal Spheres Section -->
        <div class="sphere-section">
            <div class="sphere-wrapper">
                <!-- Portal 1: Jungle -->
                <div class="sphere portal-sphere active" data-portal="jungle" data-audio="jungle.mp3">
                    <div class="portal-ring"></div>
                    <div class="portal-preview jungle-portal">
                        <canvas class="portal-canvas"></canvas>
                        <div class="portal-glow"></div>
                        <div class="portal-content">
                            <div class="portal-name">Jungle Haven</div>
                        </div>
                    </div>
                    <button class="play-btn">
                        <i class="fas fa-play"></i>
                    </button>
                </div>

                <!-- Portal 2: Seaside -->
                <div class="sphere portal-sphere" data-portal="seaside" data-audio="seaside.mp3">
                    <div class="portal-ring"></div>
                    <div class="portal-preview seaside-portal">
                        <canvas class="portal-canvas"></canvas>
                        <div class="portal-glow"></div>
                        <div class="portal-content">
                            <div class="portal-name">Seaside Calm</div>
                        </div>
                    </div>
                    <button class="play-btn">
                        <i class="fas fa-play"></i>
                    </button>
                </div>

                <!-- Portal 3: Waterfall -->
                <div class="sphere portal-sphere" data-portal="waterfall" data-audio="waterfall.mp3">
                    <div class="portal-ring"></div>
                    <div class="portal-preview waterfall-portal">
                        <canvas class="portal-canvas"></canvas>
                        <div class="portal-glow"></div>
                        <div class="portal-content">
                            <div class="portal-name">Waterfall Peace</div>
                        </div>
                    </div>
                    <button class="play-btn">
                        <i class="fas fa-play"></i>
                    </button>
                </div>

                <!-- Portal 4: Mountain -->
                <div class="sphere portal-sphere" data-portal="mountain" data-audio="mountain.mp3">
                    <div class="portal-ring"></div>
                    <div class="portal-preview mountain-portal">
                        <canvas class="portal-canvas"></canvas>
                        <div class="portal-glow"></div>
                        <div class="portal-content">
                            <div class="portal-name">Mountain Summit</div>
                        </div>
                    </div>
                    <button class="play-btn">
                        <i class="fas fa-play"></i>
                    </button>
                </div>

                <!-- Portal 5: Forest -->
                <div class="sphere portal-sphere" data-portal="forest" data-audio="forest.mp3">
                    <div class="portal-ring"></div>
                    <div class="portal-preview forest-portal">
                        <canvas class="portal-canvas"></canvas>
                        <div class="portal-glow"></div>
                        <div class="portal-content">
                            <div class="portal-name">Ancient Forest</div>
                        </div>
                    </div>
                    <button class="play-btn">
                        <i class="fas fa-play"></i>
                    </button>
                </div>

                <!-- Portal 6: Desert -->
                <div class="sphere portal-sphere" data-portal="desert" data-audio="desert.mp3">
                    <div class="portal-ring"></div>
                    <div class="portal-preview desert-portal">
                        <canvas class="portal-canvas"></canvas>
                        <div class="portal-glow"></div>
                        <div class="portal-content">
                            <div class="portal-name">Desert Stillness</div>
                        </div>
                    </div>
                    <button class="play-btn">
                        <i class="fas fa-play"></i>
                    </button>
                </div>

                <!-- Portal 7: Lake -->
                <div class="sphere portal-sphere" data-portal="lake" data-audio="lake.mp3">
                    <div class="portal-ring"></div>
                    <div class="portal-preview lake-portal">
                        <canvas class="portal-canvas"></canvas>
                        <div class="portal-glow"></div>
                        <div class="portal-content">
                            <div class="portal-name">Crystal Lake</div>
                        </div>
                    </div>
                    <button class="play-btn">
                        <i class="fas fa-play"></i>
                    </button>
                </div>

                <!-- Portal 8: Aurora -->
                <div class="sphere portal-sphere" data-portal="aurora" data-audio="aurora.mp3">
                    <div class="portal-ring"></div>
                    <div class="portal-preview aurora-portal">
                        <canvas class="portal-canvas"></canvas>
                        <div class="portal-glow"></div>
                        <div class="portal-content">
                            <div class="portal-name">Aurora Lights</div>
                        </div>
                    </div>
                    <button class="play-btn">
                        <i class="fas fa-play"></i>
                    </button>
                </div>

                <!-- Portal 9: Meadow -->
                <div class="sphere portal-sphere" data-portal="meadow" data-audio="meadow.mp3">
                    <div class="portal-ring"></div>
                    <div class="portal-preview meadow-portal">
                        <canvas class="portal-canvas"></canvas>
                        <div class="portal-glow"></div>
                        <div class="portal-content">
                            <div class="portal-name">Flower Meadow</div>
                        </div>
                    </div>
                    <button class="play-btn">
                        <i class="fas fa-play"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Hidden Audio Elements -->
    <audio id="portal-audio" preload="auto"></audio>

    <script src="mindfulness-script-v2.js"></script>
</body>
</html>
