<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CalmMe - Meditation Portals</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            background: radial-gradient(ellipse at center, #1a1a3f 0%, #0d0d1f 50%, #000 100%);
            color: white;
            overflow-x: hidden;
        }

        /* Star animation */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }
        .stars::before, .stars::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(2px 2px at 20px 30px, #fff, rgba(0,0,0,0)),
                              radial-gradient(2px 2px at 60px 70px, #eee, rgba(0,0,0,0)),
                              radial-gradient(1px 1px at 90px 10px, #fff, rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 200px 200px;
            animation: twinkle 5s infinite;
        }
        @keyframes twinkle { 0%,100%{ opacity:0.3; } 50%{ opacity:1; } }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 80px 24px 100px;
            position: relative;
            z-index: 2;
        }

        /* Page Header */
        .page-header {
            text-align: center;
            margin-bottom: 3rem;
        }
        .page-header h1 {
            font-size: 2.2rem;
            font-weight: 300;
            letter-spacing: 3px;
            background: linear-gradient(135deg, #fff, #7ec8ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 20px rgba(100,200,255,0.3);
        }
        .page-header p {
            font-size: 0.9rem;
            opacity: 0.7;
            margin-top: 0.5rem;
        }

        /* Portal Grid */
        .portals-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2rem;
            justify-items: center;
            align-items: stretch;
        }

        /* Portal Card */
        .portal-card {
            width: 100%;
            max-width: 320px;
            border-radius: 32px;
            background: rgba(20, 20, 40, 0.4);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.2);
            overflow: hidden;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            position: relative;
        }

        /* Portal Ring Effect */
        .portal-card::before {
            content: '';
            position: absolute;
            top: -8px;
            left: -8px;
            right: -8px;
            bottom: -8px;
            border-radius: 40px;
            background: conic-gradient(from 0deg, rgba(255,255,255,0.2), rgba(100,200,255,0.8), rgba(255,255,255,0.2));
            animation: spinRing 6s linear infinite;
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: -1;
        }

        .portal-card:hover::before {
            opacity: 0.7;
        }

        @keyframes spinRing {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Portal Image Container */
        .portal-image {
            width: 100%;
            aspect-ratio: 1 / 1;
            overflow: hidden;
            position: relative;
        }

        .portal-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s ease;
        }

        .portal-card:hover .portal-image img {
            transform: scale(1.08);
        }

        /* Vortex Overlay */
        .portal-image::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.6) 100%);
            pointer-events: none;
        }

        /* Portal Content */
        .portal-content {
            padding: 1.2rem 1rem 1.5rem;
            text-align: center;
        }

        .portal-icon {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            color: #7ec8ff;
        }

        .portal-name {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 0.3rem;
        }

        .portal-description {
            font-size: 0.8rem;
            opacity: 0.8;
        }

        /* Back Button (same style as breathing tab) */
        .back-btn {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: rgba(100,200,255,0.2);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(100,200,255,0.5);
            color: white;
            padding: 12px 24px;
            border-radius: 60px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            z-index: 100;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .back-btn:hover {
            background: rgba(100,200,255,0.4);
            transform: scale(1.02);
            box-shadow: 0 6px 20px rgba(100,200,255,0.3);
        }

        /* Navigation Dots - hidden on mobile */
        .dots-container {
            display: flex;
            gap: 0.8rem;
            justify-content: center;
            margin-top: 2rem;
            z-index: 50;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.6);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .dot.active {
            background: rgba(100, 200, 255, 0.9);
            border-color: white;
            transform: scale(1.3);
            box-shadow: 0 0 12px rgba(100,200,255,0.8);
        }

        /* Hide dots on mobile */
        @media (max-width: 768px) {
            .dots-container {
                display: none;
            }
            .container {
                padding: 60px 16px 90px;
            }
            .portals-grid {
                gap: 1.5rem;
            }
            .back-btn {
                bottom: 16px;
                right: 16px;
                padding: 10px 20px;
                font-size: 0.8rem;
            }
        }

        /* Simple fade-in animation */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .portal-card {
            animation: fadeInUp 0.6s ease backwards;
        }
    </style>
</head>
<body>
<div class="stars"></div>
<div class="container">
    <div class="page-header">
        <h1>✧ MEDITATION PORTALS ✧</h1>
        <p>step into a world of calm</p>
    </div>

    <div class="portals-grid" id="portalsGrid">
        <!-- Portal cards will be inserted here by JavaScript -->
    </div>

    <!-- Navigation Dots (hidden on mobile via CSS) -->
    <div class="dots-container" id="dotsContainer"></div>

    <a href="index-v2.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back to Spheres</a>
</div>

<script>
    // Portal data with image URLs (replace with your own high-res images)
    const portalsData = [
        { name: 'Jungle', icon: 'fa-tree', description: 'Rainforest · Exotic birds · Serenity', image: 'https://images.pexels.com/photos/1252890/forest-trees-nature-landscape-1252890.jpeg?auto=compress&cs=tinysrgb&w=600', url: 'jungle.html' },
        { name: 'Desert', icon: 'fa-sun', description: 'Sand dunes · Warm breeze · Silence', image: 'https://images.pexels.com/photos/2387873/desert-dunes-landscape-sand-2387873.jpeg?auto=compress&cs=tinysrgb&w=600', url: 'desert.html' },
        { name: 'Seaside', icon: 'fa-water', description: 'Ocean waves · Seagulls · Fresh air', image: 'https://images.pexels.com/photos/457882/sea-sunset-beach-ocean-457882.jpeg?auto=compress&cs=tinysrgb&w=600', url: 'seaside.html' },
        { name: 'Forest', icon: 'fa-leaf', description: 'Pine trees · Gentle wind · Peace', image: 'https://images.pexels.com/photos/240040/forest-path-forest-nature-walking-240040.jpeg?auto=compress&cs=tinysrgb&w=600', url: 'forest.html' },
        { name: 'Mountains', icon: 'fa-mountain', description: 'Peaks · Fresh air · Calmness', image: 'https://images.pexels.com/photos/618833/mountain-landscape-nature-travel-618833.jpeg?auto=compress&cs=tinysrgb&w=600', url: 'mountains.html' },
        { name: 'Meadow', icon: 'fa-feather-alt', description: 'Flowers · Butterflies · Sunshine', image: 'https://images.pexels.com/photos/1164724/field-meadow-nature-grass-1164724.jpeg?auto=compress&cs=tinysrgb&w=600', url: 'meadow.html' },
        { name: 'Waterfall', icon: 'fa-fan', description: 'Cascading water · Mist · Serenity', image: 'https://images.pexels.com/photos/1227510/waterfall-nature-waterfall-nature-1227510.jpeg?auto=compress&cs=tinysrgb&w=600', url: 'waterfall.html' },
        { name: 'Cave', icon: 'fa-gem', description: 'Echoes · Stillness · Depth', image: 'https://images.pexels.com/photos/3769520/cave-mountains-landscape-rock-3769520.jpeg?auto=compress&cs=tinysrgb&w=600', url: 'cave.html' },
        { name: 'Aurora', icon: 'fa-star-of-life', description: 'Northern lights · Magic · Dreams', image: 'https://images.pexels.com/photos/1933316/aurora-borealis-northern-lights-sky-night-1933316.jpeg?auto=compress&cs=tinysrgb&w=600', url: 'aurora.html' }
    ];

    const portalsGrid = document.getElementById('portalsGrid');
    const dotsContainer = document.getElementById('dotsContainer');

    // Function to navigate to portal page
    function goToPortal(url) {
        window.location.href = url;
    }

    // Function to generate portal cards
    function renderPortals() {
        portalsGrid.innerHTML = '';
        portalsData.forEach((portal, index) => {
            const card = document.createElement('div');
            card.className = 'portal-card';
            card.style.animationDelay = `${index * 0.05}s`;
            card.onclick = () => goToPortal(portal.url);
            card.innerHTML = `
                <div class="portal-image">
                    <img src="${portal.image}" alt="${portal.name} portal" loading="lazy">
                </div>
                <div class="portal-content">
                    <div class="portal-icon"><i class="fas ${portal.icon}"></i></div>
                    <div class="portal-name">${portal.name}</div>
                    <div class="portal-description">${portal.description}</div>
                </div>
            `;
            portalsGrid.appendChild(card);
        });
    }

    // Function to generate navigation dots (visible only on desktop)
    function renderDots() {
        dotsContainer.innerHTML = '';
        portalsData.forEach((_, index) => {
            const dot = document.createElement('div');
            dot.className = 'dot';
            if (index === 0) dot.classList.add('active');
            dot.setAttribute('data-index', index);
            dot.addEventListener('click', (e) => {
                e.stopPropagation();
                const targetIndex = parseInt(dot.getAttribute('data-index'));
                const card = document.querySelectorAll('.portal-card')[targetIndex];
                if (card) {
                    card.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    updateActiveDot(targetIndex);
                }
            });
            dotsContainer.appendChild(dot);
        });
    }

    function updateActiveDot(activeIndex) {
        const dots = document.querySelectorAll('.dot');
        dots.forEach((dot, idx) => {
            if (idx === activeIndex) dot.classList.add('active');
            else dot.classList.remove('active');
        });
    }

    // Intersection Observer to update active dot based on visible card
    function setupObserver() {
        const cards = document.querySelectorAll('.portal-card');
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    const index = Array.from(cards).indexOf(entry.target);
                    if (index !== -1) updateActiveDot(index);
                }
            });
        }, { threshold: 0.6 });

        cards.forEach(card => observer.observe(card));
    }

    // Initialize page
    renderPortals();
    renderDots();
    setTimeout(setupObserver, 200); // slight delay to ensure cards are rendered
</script>
</body>
</html>
