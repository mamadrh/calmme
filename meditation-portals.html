<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CalmMe - Mystic Portals</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            height: 100vh;
            color: white;
        }

        /* Space Background (same as index) */
        .background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center, #1a1a3f 0%, #0d0d1f 50%, #000000 100%);
            z-index: -2;
        }

        .background::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(2px 2px at 20px 30px, #eee, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 60px 70px, #fff, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 50px 50px, #fff, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 130px 80px, #fff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 90px 10px, #fff, rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 200px 200px;
            animation: twinkle 5s ease-in-out infinite;
            z-index: -1;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        .background::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.3);
            z-index: -1;
        }

        /* Main Container */
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            padding: 2rem;
            position: relative;
        }

        /* Back Button - Upper Left (exactly like breathing tab) */
        .back-btn {
            position: fixed;
            top: 24px;
            left: 24px;
            background: rgba(100,200,255,0.2);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(100,200,255,0.5);
            color: white;
            padding: 10px 20px;
            border-radius: 40px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            z-index: 100;
            font-weight: 500;
        }
        .back-btn:hover {
            background: rgba(100,200,255,0.4);
            transform: scale(1.02);
        }

        /* Portal Carousel Section */
        .portals-section {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            position: relative;
            overflow: hidden;
            perspective: 1200px;
        }

        .portal-wrapper {
            position: relative;
            width: 100%;
            max-width: 1200px;
            height: 450px;
            cursor: grab;
            transition: opacity 0.3s ease;
            transform-style: preserve-3d;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .portal-wrapper:active {
            cursor: grabbing;
        }

        /* Individual Portal Sphere */
        .portal {
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            transition: all 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
            cursor: pointer;
            transform-style: preserve-3d;
        }

        /* Outer Energy Ring (fast rotation) */
        .portal::before {
            content: '';
            position: absolute;
            top: -18px;
            left: -18px;
            right: -18px;
            bottom: -18px;
            border-radius: 50%;
            background: conic-gradient(from 0deg, 
                rgba(255,255,255,0), 
                #00ffff, 
                #ff00ff, 
                #00ffff, 
                rgba(255,255,255,0));
            animation: spinRing 4s linear infinite;
            z-index: -2;
            opacity: 0.9;
            filter: blur(4px);
        }

        /* Second inner ring (opposite) */
        .portal::after {
            content: '';
            position: absolute;
            top: -10px;
            left: -10px;
            right: -10px;
            bottom: -10px;
            border-radius: 50%;
            background: conic-gradient(from 180deg, 
                rgba(255,255,255,0.2), 
                #ff66cc, 
                #66ffcc, 
                #ff66cc, 
                rgba(255,255,255,0.2));
            animation: spinRingReverse 6s linear infinite;
            z-index: -2;
            opacity: 0.8;
            filter: blur(3px);
        }

        @keyframes spinRing {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes spinRingReverse {
            0% { transform: rotate(360deg); }
            100% { transform: rotate(0deg); }
        }

        /* Portal Inner Container (the image + vortex) */
        .portal-inner {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            overflow: hidden;
            position: relative;
            border: 2px solid rgba(255,255,255,0.9);
            box-shadow: 
                0 0 20px rgba(0,255,255,0.6),
                inset 0 0 30px rgba(255,255,255,0.3);
            transition: all 0.3s ease;
        }

        /* Environment Image - with wavy effect using SVG filter */
        .portal-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
            filter: url(#waveFilter);
            animation: gentleWave 3s infinite ease-in-out;
        }

        /* Wave animation for the image */
        @keyframes gentleWave {
            0% { filter: url(#waveFilter) brightness(1); }
            50% { filter: url(#waveFilter) brightness(1.1); }
            100% { filter: url(#waveFilter) brightness(1); }
        }

        /* Vortex Swirl Overlay (animated) */
        .portal-vortex {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: radial-gradient(circle, transparent 30%, rgba(0,0,0,0.3) 80%);
            pointer-events: none;
            z-index: 2;
            mix-blend-mode: overlay;
            animation: swirl 8s linear infinite;
        }

        @keyframes swirl {
            0% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(180deg) scale(1.1); }
            100% { transform: rotate(360deg) scale(1); }
        }

        /* Lens Flare / Glint */
        .portal-lens {
            position: absolute;
            top: 20%;
            left: 20%;
            width: 30%;
            height: 30%;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,0.6) 0%, rgba(255,255,255,0) 70%);
            pointer-events: none;
            z-index: 3;
            mix-blend-mode: screen;
            animation: glint 3s ease-in-out infinite;
        }

        @keyframes glint {
            0%, 100% { opacity: 0.3; transform: translate(0, 0); }
            50% { opacity: 0.8; transform: translate(15%, 15%); }
        }

        /* Floating particles inside portal */
        .portal-particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            pointer-events: none;
            z-index: 3;
            background-image: radial-gradient(2px 2px at 30% 40%, white, rgba(0,0,0,0)),
                              radial-gradient(3px 3px at 70% 80%, cyan, rgba(0,0,0,0)),
                              radial-gradient(1px 1px at 45% 20%, magenta, rgba(0,0,0,0));
            background-repeat: no-repeat;
            animation: floatParticles 6s infinite alternate;
        }

        @keyframes floatParticles {
            0% { background-position: 30% 40%, 70% 80%, 45% 20%; }
            100% { background-position: 35% 35%, 65% 85%, 50% 15%; }
        }

        /* Hover effect - portal expands and glows */
        .portal:hover .portal-inner {
            transform: scale(1.05);
            border-color: #fff;
            box-shadow: 0 0 40px cyan, inset 0 0 40px white;
        }

        .portal:hover::before {
            filter: blur(8px);
            opacity: 1;
        }

        /* Active portal (center) gets extra magic */
        .portal.active .portal-inner {
            border: 3px solid white;
            box-shadow: 0 0 70px cyan, 0 0 120px magenta, inset 0 0 50px white;
        }

        .portal.active .portal-vortex {
            animation-duration: 4s;
        }

        /* ---------- EXPAND ANIMATION (click effect) ---------- */
        .portal.expand {
            position: fixed !important;
            top: 50% !important;
            left: 50% !important;
            transform: translate(-50%, -50%) scale(1) !important;
            width: 100vw !important;
            height: 100vh !important;
            border-radius: 0 !important;
            z-index: 9999 !important;
            transition: all 0.6s cubic-bezier(0.2, 0.9, 0.4, 1.1) !important;
            opacity: 1 !important;
            pointer-events: none !important;
        }

        .portal.expand .portal-inner {
            border-radius: 0 !important;
            border-width: 0 !important;
            box-shadow: none !important;
        }

        .portal.expand .portal-image {
            filter: none !important;
            animation: none !important;
            transform: scale(1.05);
        }

        /* Navigation Dots */
        .dots-container {
            display: flex;
            gap: 0.8rem;
            margin-bottom: 1rem;
            justify-content: center;
            position: relative;
            z-index: 50;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.5);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .dot.active {
            background: cyan;
            border-color: white;
            transform: scale(1.3);
            box-shadow: 0 0 15px cyan;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .portal { width: 220px; height: 220px; }
            .back-btn { top: 16px; left: 16px; padding: 8px 16px; font-size: 0.8rem; }
            .dots-container { display: none; }
        }

        @media (max-width: 480px) {
            .portal { width: 180px; height: 180px; }
        }
    </style>
</head>
<body>
<div class="background"></div>
<div class="container">
    <!-- Back Button - Upper Left -->
    <a href="index-v2.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back</a>

    <div class="portals-section">
        <div class="portal-wrapper" id="portalWrapper"></div>
    </div>
    <div class="dots-container" id="dotsContainer"></div>
</div>

<!-- SVG Filter for wavy distortion -->
<svg style="position: absolute; width: 0; height: 0;" xmlns="http://www.w3.org/2000/svg">
    <filter id="waveFilter" x="-20%" y="-20%" width="140%" height="140%">
        <feTurbulence type="turbulence" baseFrequency="0.01 0.02" numOctaves="2" result="turbulence" seed="3">
            <animate attributeName="baseFrequency" values="0.01 0.02; 0.02 0.03; 0.01 0.02" dur="6s" repeatCount="indefinite" />
        </feTurbulence>
        <feDisplacementMap in="SourceGraphic" in2="turbulence" scale="5" xChannelSelector="R" yChannelSelector="G">
            <animate attributeName="scale" values="5; 8; 5" dur="4s" repeatCount="indefinite" />
        </feDisplacementMap>
    </filter>
</svg>

<script>
    // --- Portal Data (replace with your own images) ---
    const portals = [
        { image: 'images/jungle.jpg', url: 'jungle.html', fallback: 'linear-gradient(135deg, #1a5f2a, #0a2f12)' },
        { image: 'images/desert.jpg', url: 'desert.html', fallback: 'linear-gradient(135deg, #e6b800, #b8860b)' },
        { image: 'images/seaside.jpg', url: 'seaside.html', fallback: 'linear-gradient(135deg, #006994, #003d5c)' },
        { image: 'images/forest.jpg', url: 'forest.html', fallback: 'linear-gradient(135deg, #2d5a2c, #1a3b1a)' },
        { image: 'images/mountains.jpg', url: 'mountains.html', fallback: 'linear-gradient(135deg, #4a5d6c, #2c3e50)' },
        { image: 'images/meadow.jpg', url: 'meadow.html', fallback: 'linear-gradient(135deg, #8bc34a, #558b2f)' },
        { image: 'images/waterfall.jpg', url: 'waterfall.html', fallback: 'linear-gradient(135deg, #00aaff, #0055aa)' },
        { image: 'images/cave.jpg', url: 'cave.html', fallback: 'linear-gradient(135deg, #2c2c3a, #1a1a24)' },
        { image: 'images/aurora.jpg', url: 'aurora.html', fallback: 'linear-gradient(135deg, #4a0e6b, #1a0a3a)' }
    ];

    let currentIndex = 0;
    let isDragging = false;
    let startX = 0;
    let currentX = 0;
    let isExpanding = false;  // prevent multiple clicks

    const wrapper = document.getElementById('portalWrapper');
    const dotsContainer = document.getElementById('dotsContainer');

    // --- Portal Click with Expand Animation ---
    function goToPortalWithEffect(url, portalElement) {
        if (isExpanding) return;
        isExpanding = true;

        // Disable pointer events on wrapper to avoid interference
        wrapper.style.pointerEvents = 'none';

        // Add expand class to the clicked portal
        portalElement.classList.add('expand');

        // After expansion animation, redirect
        setTimeout(() => {
            window.location.href = url;
        }, 600);  // matches the transition duration
    }

    // --- Render Portal Spheres ---
    function renderPortals() {
        wrapper.innerHTML = '';
        portals.forEach((p, idx) => {
            const portalDiv = document.createElement('div');
            portalDiv.className = 'portal';
            portalDiv.setAttribute('data-index', idx);
            portalDiv.onclick = (e) => {
                e.stopPropagation();
                if (!isExpanding) {
                    goToPortalWithEffect(p.url, portalDiv);
                }
            };
            portalDiv.innerHTML = `
                <div class="portal-inner">
                    <img class="portal-image" src="${p.image}" 
                         onerror="this.style.display='none'; this.parentElement.style.background='${p.fallback}';"
                         alt="portal">
                    <div class="portal-vortex"></div>
                    <div class="portal-lens"></div>
                    <div class="portal-particles"></div>
                </div>
            `;
            wrapper.appendChild(portalDiv);
        });
    }

    // --- Carousel Logic (same as before) ---
    function updatePortals(index) {
        const portalsEl = document.querySelectorAll('.portal');
        const dots = document.querySelectorAll('.dot');
        const total = portals.length;

        portalsEl.forEach((p, i) => {
            p.classList.remove('active');
            let relativePos = i - index;
            if (relativePos > total/2) relativePos -= total;
            if (relativePos < -total/2) relativePos += total;

            if (Math.abs(relativePos) <= 1) {
                if (relativePos === 0) {
                    p.style.transform = `translateX(0px) scale(1) translateZ(0px)`;
                    p.style.opacity = 1;
                    p.style.zIndex = 10;
                    p.style.pointerEvents = 'auto';
                    p.classList.add('active');
                } else if (relativePos === -1) {
                    p.style.transform = `translateX(-340px) scale(0.65) translateZ(-60px)`;
                    p.style.opacity = 0.6;
                    p.style.zIndex = 8;
                    p.style.pointerEvents = 'none';
                } else if (relativePos === 1) {
                    p.style.transform = `translateX(340px) scale(0.65) translateZ(-60px)`;
                    p.style.opacity = 0.6;
                    p.style.zIndex = 8;
                    p.style.pointerEvents = 'none';
                }
            } else {
                p.style.opacity = 0;
                p.style.transform = `translateX(${relativePos * 500}px) scale(0.5)`;
                p.style.zIndex = 0;
                p.style.pointerEvents = 'none';
            }
        });

        dots.forEach((dot, i) => dot.classList.toggle('active', i === index));
        currentIndex = index;
    }

    function renderDots() {
        dotsContainer.innerHTML = '';
        portals.forEach((_, idx) => {
            const dot = document.createElement('div');
            dot.className = 'dot';
            dot.setAttribute('data-index', idx);
            dot.addEventListener('click', () => {
                if (!isExpanding) updatePortals(idx);
            });
            dotsContainer.appendChild(dot);
        });
        if (dotsContainer.children[0]) dotsContainer.children[0].classList.add('active');
    }

    function bindEvents() {
        wrapper.addEventListener('mousedown', (e) => {
            if (isExpanding) return;
            isDragging = true;
            startX = e.clientX;
        });
        window.addEventListener('mousemove', (e) => {
            if (!isDragging || isExpanding) return;
            currentX = e.clientX - startX;
            wrapper.style.opacity = 1 - Math.abs(currentX) / 500;
        });
        window.addEventListener('mouseup', () => {
            if (!isDragging || isExpanding) return;
            isDragging = false;
            if (Math.abs(currentX) > 50) {
                if (currentX > 0) updatePortals((currentIndex - 1 + portals.length) % portals.length);
                else updatePortals((currentIndex + 1) % portals.length);
            }
            wrapper.style.opacity = 1;
            currentX = 0;
        });

        wrapper.addEventListener('touchstart', (e) => {
            if (isExpanding) return;
            isDragging = true;
            startX = e.touches[0].clientX;
        });
        window.addEventListener('touchmove', (e) => {
            if (!isDragging || isExpanding) return;
            currentX = e.touches[0].clientX - startX;
        });
        window.addEventListener('touchend', () => {
            if (!isDragging || isExpanding) return;
            isDragging = false;
            if (Math.abs(currentX) > 50) {
                if (currentX > 0) updatePortals((currentIndex - 1 + portals.length) % portals.length);
                else updatePortals((currentIndex + 1) % portals.length);
            }
            currentX = 0;
        });

        document.addEventListener('keydown', (e) => {
            if (isExpanding) return;
            if (e.key === 'ArrowLeft') updatePortals((currentIndex - 1 + portals.length) % portals.length);
            else if (e.key === 'ArrowRight') updatePortals((currentIndex + 1) % portals.length);
        });
    }

    renderPortals();
    renderDots();
    bindEvents();
    updatePortals(0);
</script>
</body>
</html>
